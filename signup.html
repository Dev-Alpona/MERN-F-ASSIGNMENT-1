<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Dash - Create Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./signup.css" />
  </head>
  <body>
    <div class="main-container">
      <div class="left-side">
        <img src="./img/img here (1).png" alt="Food Feast" class="food-img" />
      </div>

      <div class="right-side">
        <div class="form-box">
          <div class="logo-area">
            <h2 class="logo-text">
              <span class="orange-text">Food</span> Dash.
            </h2>
            <div class="dashes">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>

          <h1 class="page-title">Create Account</h1>

          <form class="signup-form">
            <div class="input-group">
              <label for="username">Username</label>
              <input
                type="text"
                id="username"
                placeholder="Enter your username"
                required
              />
            </div>

            <div class="input-group">
              <label for="email">Email Addres</label>
              <input
                type="email"
                id="email"
                placeholder="Youraddres@email.com"
                required
              />
            </div>

            <div class="input-group">
              <label for="password">Password</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  id="password"
                  placeholder="Enter your password"
                  required
                />
                <span class="eye-icon">
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#9ca3af"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                    ></path>
                    <line x1="1" y1="23" x2="23" y2="1"></line>
                  </svg>
                </span>
              </div>
            </div>

            <button type="submit" class="submit-btn">Login to Continue</button>

            <p class="login-prompt">
              Already have an account ?
              <a href="#" class="orange-link">Log in</a>
            </p>

            <div class="social-buttons">
              <button type="button" class="social-btn">
                Login with Google
                <img src="./img/Group 1.png" alt="gogole" />
              </button>

              <button type="button" class="social-btn">
                Login with Facebook
                <img src="./img/Vector.png" alt="facebook" />
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
