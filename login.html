<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Dash - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./login.css"/>
  </head>
  <body>
    <div class="login-container">
      <div class="left-side">
        <img src="./img/img here (1).png" alt="Food Spread" />
      </div>

      <div class="right-side">
        <div class="form-content">
          <!-- Logo -->
          <div class="logo-box">
            <h2 class="logo"><span class="orange-text">Food</span> Dash.</h2>
            <div class="dashes">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>

          <h1 class="title">Login to your account!</h1>

          <div class="social-buttons">
            <button type="button" class="btn-social">
              <img src="./img/Group 1.png" alt="google" />
              Login with Google
            </button>

            <button type="button" class="btn-social">
              <img src="./img/Vector.png" alt="facebook" />
              Login with Facebook
            </button>
          </div>

          <form>
            <div class="input-box">
              <label>Email Addres</label>
              <input
                type="email"
                placeholder="Youraddres@email.com"
                value="Youraddres@email.com"
              />
            </div>

            <div class="input-box">
              <label>Password</label>
              <div class="password-wrapper">
                <input type="password" placeholder="Enter your password" />

                <span class="eye-icon">
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#9ca3af"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                    ></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </span>
              </div>
            </div>

            <button type="submit" class="btn-login">Login to Continue</button>

            <p class="signup-text">
              Don't have an account ? <a href="#">Sign up</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
