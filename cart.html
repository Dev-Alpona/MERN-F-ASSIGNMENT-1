<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart & Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./cart.css" />
  </head>
  <body>
    <div class="cart-container">
      <div class="left-section">
        <a href="#" class="back-link">
          <svg
            class="back-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Shopping Continue</span>
        </a>

        <div class="dashed-divider"></div>

        <h2 class="section-title">Shopping Item</h2>

        <div class="item-list">
          <div class="cart-card">
            <div class="item-info">
              <img
                class="food-img"
               src="./img/pav vaji.png"
                alt="Vermicelli Upma"
              />
              <span class="item-name">Vermicelli Upma</span>
            </div>

            <div class="quantity-controls">
              <button
                class="qty-btn"
                type="button"
                aria-label="Decrease quantity"
              >
                −
              </button>
              <span class="qty-number">00</span>
              <button
                class="qty-btn"
                type="button"
                aria-label="Increase quantity"
              >
                +
              </button>
            </div>

            <div class="item-price">₹200</div>

            <button class="delete-btn" type="button" aria-label="Remove item">
              <svg
                class="trash-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="3 6 5 6 21 6"></polyline>
                <path
                  d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                ></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          </div>

          <div class="cart-card">
            <div class="item-info">
              <img
                class="food-img"
                src="./img/pav vaji.png"
                alt="Vermicelli Upma"
              />
              <span class="item-name">Vermicelli Upma</span>
            </div>

            <div class="quantity-controls">
              <button
                class="qty-btn"
                type="button"
                aria-label="Decrease quantity"
              >
                −
              </button>
              <span class="qty-number">00</span>
              <button
                class="qty-btn"
                type="button"
                aria-label="Increase quantity"
              >
                +
              </button>
            </div>

            <div class="item-price">₹200</div>

            <button class="delete-btn" type="button" aria-label="Remove item">
              <svg
                class="trash-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="3 6 5 6 21 6"></polyline>
                <path
                  d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                ></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          </div>

          <div class="cart-card">
            <div class="item-info">
              <img
                class="food-img"
               src="./img/pav vaji.png"
                alt="Vermicelli Upma"
              />
              <span class="item-name">Vermicelli Upma</span>
            </div>

            <div class="quantity-controls">
              <button
                class="qty-btn"
                type="button"
                aria-label="Decrease quantity"
              >
                −
              </button>
              <span class="qty-number">00</span>
              <button
                class="qty-btn"
                type="button"
                aria-label="Increase quantity"
              >
                +
              </button>
            </div>

            <div class="item-price">₹200</div>

            <button class="delete-btn" type="button" aria-label="Remove item">
              <svg
                class="trash-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="3 6 5 6 21 6"></polyline>
                <path
                  d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                ></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          </div>

          <div class="cart-card">
            <div class="item-info">
              <img
                class="food-img"
                src="./img/pav vaji.png"
                alt="Vermicelli Upma"
              />
              <span class="item-name">Vermicelli Upma</span>
            </div>

            <div class="quantity-controls">
              <button
                class="qty-btn"
                type="button"
                aria-label="Decrease quantity"
              >
                −
              </button>
              <span class="qty-number">00</span>
              <button
                class="qty-btn"
                type="button"
                aria-label="Increase quantity"
              >
                +
              </button>
            </div>

            <div class="item-price">₹200</div>

            <button class="delete-btn" type="button" aria-label="Remove item">
              <svg
                class="trash-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="3 6 5 6 21 6"></polyline>
                <path
                  d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                ></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="right-section">
        <div class="card-header">
          <h2 class="card-title">Card Details</h2>
          <img
            class="user-avatar"
            src="./img/img-1.png"
            alt="Cardholder Avatar"
          />
        </div>

        <form class="card-form" onsubmit="event.preventDefault()">
          <div class="form-group">
            <label for="card-name">Name on card</label>
            <input type="text" id="card-name" placeholder="Name" />
          </div>

          <div class="form-group">
            <label for="card-number">Card Number</label>
            <input
              type="text"
              id="card-number"
              placeholder="1111 2222 3333 4444"
            />
          </div>

          <div class="form-row">
            <div class="form-group half-width">
              <label for="exp-date">Expiration date</label>
              <input type="text" id="exp-date" placeholder="mm/yy" />
            </div>

            <div class="form-group half-width">
              <label for="cvv">CVV</label>
              <input type="text" id="cvv" placeholder="123" />
            </div>
          </div>

          <div class="summary-section">
            <div class="summary-row">
              <span>Subtotal</span>
              <span>$1,668</span>
            </div>

            <div class="summary-row">
              <span>Shipping <strong>(Free Delivery )</strong></span>
              <span>$0</span>
            </div>

            <div class="summary-row">
              <span>Total (Tax incl.)</span>
              <span>$1,672</span>
            </div>
          </div>

          <button type="submit" class="checkout-btn">Checkout</button>
        </form>
      </div>
    </div>
  </body>
</html>
